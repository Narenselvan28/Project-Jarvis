version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: arivon_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: production_planning
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: arivon_backend
    restart: always
    environment:
      - APP_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/production_planning
      - MONGO_DB_NAME=production_planning
      - SECRET_KEY=arivon-production-secret-key-2026
      - JWT_SECRET_KEY=arivon-jwt-secret-key-2026
      - CP_SAT_TIME_LIMIT_SECONDS=30
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
