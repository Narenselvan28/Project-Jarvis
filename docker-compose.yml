version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aps_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adaptive_factory
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: aps_backend
    environment:
      - DB_DRIVER=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=adaptive_factory
      - SECRET_KEY=adaptive-scheduling-secret-key-prod-2026
      - JWT_SECRET_KEY=jwt-super-secret-scheduling-key-2026
      - CP_SAT_TIME_LIMIT_SECONDS=30
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
