<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ReFlow — Adaptive Production Scheduling & Disruption Management Platform" />
    <title>ReFlow — Adaptive Production Intelligence</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              bgMain: '#F8FAFC',
              surface: '#FFFFFF',
              borderCol: '#E2E8F0',
              textMain: '#0F172A',
              textSub: '#475569',
              primary: '#1E293B',        // Industrial Charcoal Navy
              primaryHover: '#0F172A',
              primaryLight: '#F1F5F9',
              brandBlue: '#2563EB',
              brandTeal: '#0D9488',
              statusRunning: '#16A34A',
              statusAvailable: '#0D9488',
              statusIdle: '#64748B',
              statusSetup: '#D97706',
              statusBlocked: '#EA580C',
              statusFailed: '#DC2626',
              statusMaint: '#7C3AED',
              statusReassigned: '#2563EB',
              statusRepaired: '#0D9488',
              statusVerified: '#059669',
            },
            boxShadow: {
              'soft': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
              'modal': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>

    <style>
      /* Clean Light Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F1F5F9; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

      /* Form Elements */
      select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
      input[type="checkbox"] {
        accent-color: #1E293B;
        width: 14px;
        height: 14px;
        cursor: pointer;
        border-radius: 4px;
      }

      /* Modal Backdrop */
      .modal-backdrop {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(2px);
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-textMain font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
