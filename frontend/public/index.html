<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fixoria — Booking Report & Adaptive Production Intelligence Platform" />
    <title>Fixoria — Booking Report</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              bgMain: '#F9FAFB',
              surface: '#FFFFFF',
              borderCol: '#E5E7EB',
              textMain: '#1F2937',
              textSub: '#6B7280',
              primary: '#714B67', // Odoo Plum
              primaryHover: '#5C3D54',
              primaryLight: '#F4EBF1',
              success: '#10B981',
              successLight: '#ECFDF5',
              warning: '#F59E0B',
              warningLight: '#FFFBEB',
              critical: '#E11D48',
              criticalLight: '#FFF1F2',
            },
            boxShadow: {
              'soft': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
              'card-hover': '0 10px 15px -3px rgba(113, 75, 103, 0.05), 0 4px 6px -2px rgba(113, 75, 103, 0.03)',
              'float': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>

    <style>
      /* Clean Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

      /* Remove default select styling */
      select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }

      /* Custom Checkbox */
      input[type="checkbox"] {
        accent-color: #714B67; /* Odoo Plum */
        width: 14px;
        height: 14px;
        cursor: pointer;
        border-radius: 4px;
      }

      /* Skeleton Pulse */
      .skeleton {
        background: linear-gradient(90deg, #F3F4F6 25%, #E5E7EB 50%, #F3F4F6 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Subtle Card Lift */
      .kpi-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .kpi-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(113, 75, 103, 0.05), 0 4px 6px -2px rgba(113, 75, 103, 0.03);
        border-color: #D1D5DB;
      }

      /* Status Pill Transition */
      .status-pill {
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      /* Slide-over Panel */
      .slide-over {
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .slide-over.open {
        transform: translateX(0);
      }
    </style>
  </head>
  <body class="bg-white text-textMain font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
